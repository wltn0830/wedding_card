<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WEDDING - 참석 여부 관리</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #f8f9fa; }
        .serif-font { font-family: 'Cinzel', serif; }
    </style>
</head>
<body class="p-3 sm:p-8 min-h-screen text-gray-800">

    <div class="max-w-4xl mx-auto bg-white p-4 sm:p-8 rounded-lg shadow-sm border border-gray-100">
        
        <!-- 모바일 대응 헤더 (flex-col / sm:flex-row) -->
        <div class="border-b border-black pb-4 mb-5 flex flex-col sm:flex-row justify-between items-start sm:items-end gap-3">
            <div>
                <h1 class="serif-font text-xl sm:text-3xl text-black font-semibold tracking-wide">대승 ♡ 서우 모바일 청첩장<br>참석 여부 실시간 현황<</h1>
            </div>
            <button onclick="loadRsvpData()" class="self-end sm:self-auto bg-black text-white text-[11px] sm:text-xs px-3 py-1.5 hover:bg-gray-800 transition-colors flex items-center gap-1">
                <span>🔄</span> 새로고침
            </button>
        </div>

        <!-- 통계 요약 카드 (2x2 그리드) -->
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 sm:gap-3 mb-6">
            <div class="bg-gray-50 p-3 sm:p-4 border border-gray-100 rounded-sm text-center">
                <p class="text-[10px] sm:text-[11px] text-gray-500 mb-0.5">총 응답 수</p>
                <p class="text-lg sm:text-xl font-bold text-black" id="stat-total-responses">0건</p>
            </div>
            <div class="bg-gray-50 p-3 sm:p-4 border border-gray-100 rounded-sm text-center">
                <p class="text-[10px] sm:text-[11px] text-gray-500 mb-0.5">총 참석 예상 인원</p>
                <p class="text-lg sm:text-xl font-bold text-black" id="stat-total-guests">0명</p>
            </div>
            <div class="bg-gray-50 p-3 sm:p-4 border border-gray-100 rounded-sm text-center">
                <p class="text-[10px] sm:text-[11px] text-gray-500 mb-0.5">신랑측 참석 인원</p>
                <p class="text-lg sm:text-xl font-bold text-blue-600" id="stat-groom-guests">0명</p>
            </div>
            <div class="bg-gray-50 p-3 sm:p-4 border border-gray-100 rounded-sm text-center">
                <p class="text-[10px] sm:text-[11px] text-gray-500 mb-0.5">신부측 참석 인원</p>
                <p class="text-lg sm:text-xl font-bold text-rose-600" id="stat-bride-guests">0명</p>
            </div>
        </div>

        <!-- 필터 탭 -->
        <div class="flex space-x-1.5 mb-3 text-xs">
            <button onclick="filterData('all')" id="btn-filter-all" class="filter-btn px-3 py-1.5 border border-black bg-black text-white font-medium">전체보기</button>
            <button onclick="filterData('신랑')" id="btn-filter-groom" class="filter-btn px-3 py-1.5 border border-gray-200 text-gray-600 hover:border-black">신랑측</button>
            <button onclick="filterData('신부')" id="btn-filter-bride" class="filter-btn px-3 py-1.5 border border-gray-200 text-gray-600 hover:border-black">신부측</button>
        </div>

        <!-- 데이터 테이블 (가로 스크롤 및 텍스트 줄바꿈 방지 적용) -->
        <div class="w-full overflow-x-auto border border-gray-100 rounded-sm">
            <table class="w-full text-left text-xs whitespace-nowrap min-w-[500px]">
                <thead class="bg-gray-50 border-b border-gray-200 text-gray-600 font-medium">
                    <tr>
                        <th class="p-2.5">구분</th>
                        <th class="p-2.5">성함</th>
                        <th class="p-2.5">참석여부</th>
                        <th class="p-2.5">식사여부</th>
                        <th class="p-2.5">동행인</th>
                        <th class="p-2.5">총 인원</th>
                        <th class="p-2.5">제출일시</th>
                    </tr>
                </thead>
                <tbody id="rsvp-table-body" class="divide-y divide-gray-100">
                    <tr>
                        <td colspan="7" class="p-8 text-center text-gray-400">데이터를 불러오는 중입니다...</td>
                    </tr>
                </tbody>
            </table>
        </div>

    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAZgXwCD2QS_GNX-6g_9wvNWpVyAteeLQQ",
            authDomain: "weddingcard-d8ed2.firebaseapp.com",
            databaseURL: "https://weddingcard-d8ed2-default-rtdb.asia-southeast1.firebasedatabase.app", 
            projectId: "weddingcard-d8ed2",
            storageBucket: "weddingcard-d8ed2.firebasestorage.app",
            messagingSenderId: "821945501060",
            appId: "1:821945501060:web:d7dcab67d88373c5f409d1"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let rsvpRawData = [];
        let currentFilter = 'all';

        // 데이터 실시간 로드
        window.loadRsvpData = function() {
            const rsvpRef = ref(db, 'rsvp');
            onValue(rsvpRef, (snapshot) => {
                const data = snapshot.val();
                if (!data) {
                    document.getElementById('rsvp-table-body').innerHTML = `
                        <tr><td colspan="7" class="p-8 text-center text-gray-400">등록된 참석 여부 데이터가 없습니다.</td></tr>
                    `;
                    updateStats([]);
                    return;
                }

                rsvpRawData = Object.keys(data).map(key => ({
                    id: key,
                    ...data[key]
                })).reverse();

                renderTable();
                updateStats(rsvpRawData);
            });
        };

        // 테이블 렌더링
        function renderTable() {
            const tbody = document.getElementById('rsvp-table-body');
            tbody.innerHTML = '';

            const filtered = rsvpRawData.filter(item => {
                if (currentFilter === 'all') return true;
                return item.side === currentFilter;
            });

            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="p-8 text-center text-gray-400">해당하는 데이터가 없습니다.</td></tr>`;
                return;
            }

            filtered.forEach(item => {
                const totalPeople = item.attend === '참석' ? (parseInt(item.guests || 0) + 1) : 0;
                const sideBadge = item.side === '신랑' 
                    ? `<span class="bg-blue-50 text-blue-600 px-2 py-0.5 rounded text-[10px] font-bold">신랑측</span>`
                    : `<span class="bg-rose-50 text-rose-600 px-2 py-0.5 rounded text-[10px] font-bold">신부측</span>`;

                const attendBadge = item.attend === '참석'
                    ? `<span class="text-emerald-600 font-bold">참석</span>`
                    : `<span class="text-gray-400">불참석</span>`;

                const tr = document.createElement('tr');
                tr.className = "hover:bg-gray-50/80 transition-colors";
                tr.innerHTML = `
                    <td class="p-2.5">${sideBadge}</td>
                    <td class="p-2.5 font-bold text-gray-900">${item.name}</td>
                    <td class="p-2.5">${attendBadge}</td>
                    <td class="p-2.5 text-gray-600">${item.meal || '-'}</td>
                    <td class="p-2.5 text-gray-600">${item.guests || 0}명</td>
                    <td class="p-2.5 font-bold text-black">${totalPeople > 0 ? totalPeople + '명' : '-'}</td>
                    <td class="p-2.5 text-gray-400 text-[11px]">${item.date || '-'}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        // 통계 계산
        function updateStats(data) {
            let totalResponses = data.length;
            let totalGuests = 0;
            let groomGuests = 0;
            let brideGuests = 0;

            data.forEach(item => {
                if (item.attend === '참석') {
                    const count = parseInt(item.guests || 0) + 1;
                    totalGuests += count;
                    if (item.side === '신랑') groomGuests += count;
                    if (item.side === '신부') brideGuests += count;
                }
            });

            document.getElementById('stat-total-responses').innerText = totalResponses + '건';
            document.getElementById('stat-total-guests').innerText = totalGuests + '명';
            document.getElementById('stat-groom-guests').innerText = groomGuests + '명';
            document.getElementById('stat-bride-guests').innerText = brideGuests + '명';
        }

        // 필터링
        window.filterData = function(type) {
            currentFilter = type;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('bg-black', 'text-white');
                btn.classList.add('border-gray-200', 'text-gray-600');
            });
            
            const activeBtn = type === 'all' ? 'btn-filter-all' : (type === '신랑' ? 'btn-filter-groom' : 'btn-filter-bride');
            document.getElementById(activeBtn).classList.remove('border-gray-200', 'text-gray-600');
            document.getElementById(activeBtn).classList.add('bg-black', 'text-white');

            renderTable();
        };

        loadRsvpData();
    </script>
</body>
</html>
